  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --text: #f5f7fa;
      --muted: #9aa4b2;
      --accent: #00a67e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      background:
        radial-gradient(
          circle at 75% 50%,
          rgba(0, 166, 126, 0.10),
          transparent 35%
        ),
        var(--bg);
    }

    .background {
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(
          90deg,
          rgba(8, 11, 16, 0.98) 0%,
          rgba(8, 11, 16, 0.94) 35%,
          rgba(8, 11, 16, 0.60) 65%,
          rgba(8, 11, 16, 0.30) 100%
        ),
        url("enerfabric-thumbnail.png");
      background-size: cover;
      background-position: center;
      filter: saturate(0.85);
      transform: scale(1.025);
      animation: backgroundIn 900ms ease-out both;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(
          180deg,
          rgba(8, 11, 16, 0.18),
          rgba(8, 11, 16, 0.55)
        );
    }

    .content {
      width: min(900px, calc(100% - 48px));
      padding: 48px;
      animation: contentIn 650ms ease-out both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 22px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(0, 166, 126, 0.65);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(32px, 5vw, 62px);
      line-height: 1.04;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .subtitle {
      max-width: 650px;
      margin: 20px 0 34px;
      color: #c2cad5;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.55;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: #e5e7eb;
      font-size: 14px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.20);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    .fallback {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 12px;
      opacity: 0;
      animation: fallbackIn 2s ease 2s forwards;
    }

    .fallback a {
      color: #d8dee8;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes backgroundIn {
      from {
        opacity: 0;
        transform: scale(1.05);
      }

      to {
        opacity: 1;
        transform: scale(1.025);
      }
    }

    @keyframes fallbackIn {
      to {
        opacity: 1;
      }
    }

    @media (max-width: 640px) {
      .content {
        width: min(100% - 32px, 900px);
        padding: 28px 16px;
      }

      .background {
        background-position: 62% center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="background"></div>
    <div class="overlay"></div>

    <section class="content" aria-label="Opening article">
      <div class="eyebrow">Technical Article</div>

      <h1>
        Building EnerFabric: Intent-Driven Energy Orchestration on AWS
      </h1>

      <p class="subtitle">
        A technical walkthrough of EnerFabric and its approach to
        intent-driven orchestration of distributed energy resources.
      </p>

      <div class="loading" aria-label="Opening article">
        <span class="spinner"></span>
        <span>Opening article…</span>
      </div>
    </section>
  </main>

  <div class="fallback">
    Taking too long?
    <a
      href="https://builder.aws.com/content/3JbPJCddvy8toEuNfNZUgl1iK7i/building-enerfabric-intent-driven-energy-orchestration-on-aws"
    >
      Open the article
    </a>
  </div>

  <script>
    const destination =
      "https://builder.aws.com/content/3JbPJCddvy8toEuNfNZUgl1iK7i/building-enerfabric-intent-driven-energy-orchestration-on-aws";

    // Give browsers enough time to paint the page naturally,
    // while keeping the transition quick.
    window.setTimeout(() => {
      window.location.replace(destination);
    }, 750);
  </script>
</body>
</html>
